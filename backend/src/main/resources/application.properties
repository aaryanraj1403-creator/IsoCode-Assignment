spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reconflow}
spring.datasource.username=${DATABASE_USER:reconflow}
spring.datasource.password=${DATABASE_PASSWORD}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
reconflow.upload-dir=${UPLOAD_DIR:./uploads}
reconflow.return-days=${RETURN_GRACE_DAYS:14}
logging.level.root=INFO
debug=false
server.error.include-message=never
